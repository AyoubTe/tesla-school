# Full stack: PostgreSQL, Mailpit (catches every email the app sends), the Spring Boot API and the Angular app.
#   docker compose up --build
#   App:     http://localhost:4200
#   Mailbox: http://localhost:8025
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tesla_school
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla -d tesla_school"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/tesla_school
      DB_USER: tesla
      DB_PASSWORD: tesla
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:4200
      CORS_ORIGINS: http://localhost:4200
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-of-32-bytes-or-more}
    ports: ["8085:8085"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["4200:80"]

volumes:
  pgdata:
