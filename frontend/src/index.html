<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tesla School</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tesla School portal for students, teachers and administration.">
  <meta name="theme-color" content="#10263F">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('tesla.theme'); if (t) document.documentElement.dataset['theme'] = t; } catch (e) {}
  </script>
</head>

</body>
</html>
